name: Build and Release Kodi Add-ons

# Every push to main builds + tests. A GitHub Release is created
# automatically ONLY when addon.xml version was bumped
# (i.e. tag <addon-id>-v<version> does not exist yet).
# Commits without a version bump just run CI, no duplicate release.

on:
  push:
    branches: [main, master]
    tags: ["plugin.*-v*", "v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests beautifulsoup4

      - name: Validate addon.xml files
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET, sys
          files = glob.glob('plugin.*/addon.xml')
          if not files:
              print('No plugin.*/addon.xml found'); sys.exit(1)
          for f in files:
              root = ET.parse(f).getroot()
              print(f"{f}: id={root.get('id')} version={root.get('version')}")
              assert root.get('id') and root.get('version'), f'missing id/version in {f}'
          EOF

      - name: Validate settings.xml files
        run: |
          python3 - <<'EOF'
          import glob, os, re, xml.etree.ElementTree as ET, sys
          # Old-format setting types accepted by Kodi; anything else (e.g.
          # type="password", type="integer") breaks the whole settings
          # dialog. Passwords must be type="string" option="hidden",
          # numbers type="text" parsed in code.
          VALID_TYPES = {'string', 'boolean', 'number', 'select',
                         'enum', 'labelenum', 'slider', 'file', 'folder',
                         'action', 'addon', 'date', 'time', 'ipaddress',
                         'color', 'label', 'lsep', 'sep', 'text', 'bool'}
          ok = True
          for f in glob.glob('plugin.*/resources/settings.xml'):
              addon = f.split('/')[0]
              root = ET.parse(f).getroot()
              labels = []
              for s in root.iter('setting'):
                  sid, stype = s.get('id'), s.get('type')
                  label = s.get('label', '')
                  print(f"{f}: id={sid} type={stype} label={label}")
                  if stype not in VALID_TYPES:
                      print(f"ERROR: invalid setting type {stype!r} in {f}")
                      ok = False
                  if label.isdigit():
                      labels.append(label)
              for c in root.iter('category'):
                  if c.get('label', '').isdigit():
                      labels.append(c.get('label'))
              # every numeric label must resolve in an English strings.po
              po = os.path.join(addon, 'resources/language',
                                'resource.language.en_gb/strings.po')
              if labels:
                  if not os.path.exists(po):
                      print(f"ERROR: {f} uses numeric labels but {po} missing")
                      ok = False
                  else:
                      text = open(po, encoding='utf-8').read()
                      for label in labels:
                          if f'msgctxt "#{label}"' not in text:
                              print(f"ERROR: label {label} missing in {po}")
                              ok = False
          sys.exit(0 if ok else 1)
          EOF

      - name: Run pytest (all addons)
        run: |
          for d in plugin.*/; do
            if [ -d "$d/tests" ]; then
              echo "== pytest $d =="
              python -m pytest "$d/tests" -v
            fi
          done

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Discover addons
        id: discover
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import glob, json, os
          addons = sorted(d.rstrip('/') for d in glob.glob('plugin.*/') if os.path.exists(os.path.join(d, 'addon.xml')))
          print(f"matrix={json.dumps(addons)}")
          EOF
      - name: Show discovered addons
        run: |
          echo "addons: $MATRIX"
        env:
          MATRIX: ${{ steps.discover.outputs.matrix }}

      - name: Build zip(s) with repo script
        run: |
          python3 scripts/build_zip.py --out dist
          ls -lh dist/
          sha256sum dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kodi-addons
          path: dist/*

  release:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: kodi-addons
          path: dist

      - name: Create per-addon releases for bumped versions
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const fs = require('fs');
            const path = require('path');
            const { execSync } = require('child_process');

            const addons = fs.readdirSync('.', { withFileTypes: true })
              .filter(d => d.isDirectory() && d.name.startsWith('plugin.'))
              .map(d => d.name)
              .filter(n => fs.existsSync(path.join(n, 'addon.xml')));
            if (!addons.length) { core.setFailed('no addons found'); return; }

            const created = [];
            for (const addon of addons) {
              const xml = fs.readFileSync(path.join(addon, 'addon.xml'), 'utf8');
              const m = xml.match(/<addon[^>]*\bversion\s*=\s*"([^"]+)"/);
              if (!m) { core.warning(`no version in ${addon}/addon.xml`); continue; }
              const version = m[1];
              const tag = `${addon}-v${version}`;
              const zip = path.join('dist', `${addon}-${version}.zip`);
              if (!fs.existsSync(zip)) { core.warning(`missing ${zip}`); continue; }

              // Skip if release/tag already exists -> commit had no version bump
              try {
                execSync(`git rev-parse --verify refs/tags/${tag}`, { stdio: 'ignore' });
                console.log(`skip ${tag}: tag already exists`);
                continue;
              } catch {}
              try {
                await github.rest.repos.getReleaseByTag({ owner, repo, tag });
                console.log(`skip ${tag}: release already exists`);
                continue;
              } catch (e) {
                if (e.status !== 404) throw e;
              }

              // Commit messages since the previous release of this addon,
              // so the release page shows what changed.
              let changes = '';
              try {
                const prev = execSync(
                  `git tag --list '${addon}-v*' --sort=-creatordate | head -1`,
                  { encoding: 'utf8' }).trim();
                const range = prev ? `${prev}..HEAD` : 'HEAD';
                const log = execSync(
                  `git log ${range} --max-count=20 --format='%h %s' -- ${addon} README.md`,
                  { encoding: 'utf8' }).trim();
                if (log) changes = log.split('\n').map(l => `- ${l}`).join('\n');
              } catch (e) {
                console.log(`no commit history for ${tag}: ${e.message}`);
              }

              console.log(`creating release ${tag}`);
              await github.rest.git.createRef({
                owner, repo, ref: `refs/tags/${tag}`,
                sha: context.sha,
              });
              await github.rest.repos.createRelease({
                owner, repo,
                tag_name: tag,
                name: tag,
                body: `Kodi add-on **${addon}** version **${version}**.\n\nInstall: Kodi → Add-ons → Install from zip → \`${addon}-${version}.zip\`` +
                  (changes ? `\n\n### Changes\n${changes}` : ''),
              });
              created.push(tag);
            }
            core.setOutput('created_tags', created.join('\n'));

      - name: Upload zips to releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CREATED_TAGS: ${{ steps.create.outputs.created_tags }}
        run: |
          # Immutable releases: only upload zips for tags created in THIS run.
          # Never overwrite a pre-existing release asset.
          if [ -z "$CREATED_TAGS" ]; then
            echo "no releases created in this run; nothing to upload"
            exit 0
          fi
          for f in dist/plugin.*-*.zip; do
            [ -e "$f" ] || continue
            base=$(basename "$f" .zip)            # e.g. plugin.video.fmovies-1.2.1
            version="${base##*-}"
            addon="${base%-*}"
            tag="$addon-v$version"
            if printf '%s\n' "$CREATED_TAGS" | grep -qx "$tag"; then
              echo "== uploading $f to $tag =="
              gh release upload "$tag" "$f" "$f.sha256"
            else
              echo "skip $f (tag $tag not created in this run)"
            fi
          done
